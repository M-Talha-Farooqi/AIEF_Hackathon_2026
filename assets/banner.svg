<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1A"/>
      <stop offset="0.55" stop-color="#160F3A"/>
      <stop offset="1" stop-color="#0A3442"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.6" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="230" cy="200" r="190" fill="url(#glow)"/>

  <!-- viewfinder brackets -->
  <g stroke="#22D3EE" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M100 90 H70 V120"/>
    <path d="M360 90 H390 V120"/>
    <path d="M100 310 H70 V280"/>
    <path d="M360 310 H390 V280"/>
  </g>
  <!-- eye -->
  <path d="M95 200 C150 120, 310 120, 365 200 C310 280, 150 280, 95 200 Z" fill="#0B1228" stroke="url(#accent)" stroke-width="5"/>
  <circle cx="230" cy="200" r="58" fill="url(#iris)"/>
  <circle cx="230" cy="200" r="24" fill="#070B1A"/>
  <circle cx="246" cy="184" r="9" fill="#FFFFFF" opacity="0.9"/>
  <!-- scan line -->
  <rect x="80" y="196" width="300" height="3" fill="#22D3EE" opacity="0.55"/>

  <!-- LIVE chip -->
  <rect x="1110" y="34" width="132" height="40" rx="20" fill="#1F0D16" stroke="#F43F5E" stroke-opacity="0.6"/>
  <circle cx="1136" cy="54" r="7" fill="#F43F5E"/>
  <text x="1152" y="61" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#FDA4AF" letter-spacing="2">LIVE</text>

  <!-- title -->
  <text x="450" y="185" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Anoma<tspan fill="url(#accent)">EYE</tspan></text>
  <text x="454" y="235" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#C7D2FE">Real-time CCTV crime detection with verified alerts</text>
  <text x="454" y="271" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#C7D2FE">and multi-channel incident response</text>

  <rect x="454" y="300" width="560" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <text x="478" y="329" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#E0E7FF">AIEF 4th International AI Championship  ·  AI in Urban Tech</text>
</svg>
